services:

  # ─────────────────────────────────────────
  # Banco de dados PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medusa_network

  # ─────────────────────────────────────────
  # Cache e filas com Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medusa_network

  # ─────────────────────────────────────────
  # API do Medusa (backend)
  # ─────────────────────────────────────────
  medusa:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medusa_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      NODE_ENV: ${NODE_ENV}
      STORE_CORS: http://localhost
      ADMIN_CORS: http://localhost
      AUTH_CORS: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medusa_network
    # Porta exposta apenas internamente — o Nginx faz o proxy
    ports:
      - "9000:9000"

  # ─────────────────────────────────────────
  # Proxy reverso com Nginx
  # ─────────────────────────────────────────
  nginx:
    build: ./nginx
    container_name: medusa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - medusa
    networks:
      - medusa_network

# ─────────────────────────────────────────
# Volumes persistentes
# ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ─────────────────────────────────────────
# Rede interna isolada
# ─────────────────────────────────────────
networks:
  medusa_network:
    driver: bridge
